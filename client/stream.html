<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Dungeon — 3D stream</title>
  <link rel="stylesheet" href="/src/stream/stream.css" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <canvas id="c2" class="off"></canvas>
  <div id="labels2" class="off"></div>
  <div class="ui">
    <div id="top" class="panel">
      <div class="live"><i></i>Live</div>
      <div>
        <div class="brand">The Dungeon</div>
        <div class="meta" id="meta">—</div>
      </div>
    </div>
    <div id="timers" class="panel">
      <div id="collapse" class="collapse"></div>
      <div class="turn"><span id="turn">Turn —</span><div class="bar"><i id="turn-bar"></i></div></div>
    </div>
    <div id="feed"></div>
    <div id="lb" class="panel"></div>
    <div id="floors" class="panel hidden"></div>
    <div id="season" class="hidden"><div class="s1">End of the season</div><div class="s2" id="season-sub"></div><div id="season-list"></div><div class="s3">Thanks for playing! See you next season.</div></div>
    <div id="helpp" class="panel hidden"><h3>Dungeon commands</h3><div id="helpp-list"></div><div class="foot">One command per turn: the last one typed counts.</div></div>
    <div id="card" class="hidden"><div class="c1"></div><div class="c2"></div></div>
    <div id="chat" class="panel"><h3>Chat</h3><div id="chat-list"></div></div>
    <div id="topc"><div id="vote" class="panel hidden"></div><div id="bet" class="panel hidden"></div></div>
    <div id="shot" class="muted"></div>
    <div id="ia" class="panel hidden"><div class="orb"></div><div><div class="hl">Dungeon AI</div><div id="ia-text"></div></div></div>
    <div id="lt"><span class="lt-tag">Plot twist</span><span id="lt-text"></span></div>
    <div id="cta" class="panel"></div>
    <div id="pause" class="hidden">Pause</div>
  </div>
  <div id="load"><div class="brand big">The Dungeon</div><div class="bar wide"><i id="load-bar"></i></div><p id="load-msg">Loading the 3D dungeon…</p></div>
  <script type="module" src="/src/stream/main.ts"></script>
</body>
</html>
