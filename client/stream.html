<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Donjon — stream 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="/src/stream/stream.css" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <canvas id="c2" class="off"></canvas>
  <div id="labels2" class="off"></div>
  <div class="ui">
    <div id="top" class="panel">
      <div class="live"><i></i>EN DIRECT</div>
      <div>
        <div class="brand">LE DONJON</div>
        <div class="meta" id="meta">—</div>
      </div>
    </div>
    <div id="timers" class="panel">
      <div id="collapse" class="collapse"></div>
      <div class="turn"><span id="turn">Tour —</span><div class="bar"><i id="turn-bar"></i></div></div>
    </div>
    <div id="feed"></div>
    <div id="lb" class="panel"></div>
    <div id="floors" class="panel hidden"></div>
    <div id="season" class="hidden"><div class="s1">FIN DE LA SAISON</div><div class="s2" id="season-sub"></div><div id="season-list"></div><div class="s3">Merci d'avoir joué ! Rendez-vous à la prochaine saison.</div></div>
    <div id="helpp" class="panel hidden"><h3>Les commandes du Donjon</h3><div id="helpp-list"></div><div class="foot">Une commande par tour : la dernière tapée compte.</div></div>
    <div id="card" class="hidden"><div class="c1"></div><div class="c2"></div></div>
    <div id="cmds" class="panel hidden"><h3>Commandes du chat</h3><div id="cmds-list"></div></div>
    <div id="vote" class="panel hidden"></div>
    <div id="shot" class="muted"></div>
    <div id="ia" class="panel hidden"><div class="orb"></div><div><div class="hl">L'IA DU DONJON</div><div id="ia-text"></div></div></div>
    <div id="lt"><span class="lt-tag">EN DIRECT</span><span id="lt-text"></span></div>
    <div id="cta" class="panel"></div>
    <div id="pause" class="hidden">PAUSE</div>
  </div>
  <div id="load"><div class="brand big">LE DONJON</div><div class="bar wide"><i id="load-bar"></i></div><p id="load-msg">Chargement du donjon en 3D…</p></div>
  <script type="module" src="/src/stream/main.ts"></script>
</body>
</html>
